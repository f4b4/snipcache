# Showcase — nginx site config (Cestius monorepo)
#
# HTTPS-only. This committed file is the single source of truth for TLS: it
# references the standard Let's Encrypt cert paths directly. certbot only ISSUES
# the cert (`certbot certonly --webroot`); it never edits this file, so a later
# -ConfigOnly safely re-applies it with no risk of reverting TLS.
#
# Bootstrap: on a fresh box (no cert yet) `nginx -t` would fail on the missing
# cert, so setup.sh installs a temporary HTTP-only ACME stub until the cert is
# issued, then converges to this file. See scripts/deploy/lib/setup.sh.
#
# Port 80 carries NO app content — it serves only the ACME challenge and 301s
# everything else to HTTPS (the app is HTTPS-only, which the future .app domain
# requires via the HSTS preload list).

# Rate limiting — http context, name unique per app.
limit_req_zone $binary_remote_addr zone=showcase_per_ip:10m rate=120r/m;

# HTTP: ACME challenge + redirect to HTTPS. No app served here.
server {
    listen 80;
    server_name showcase.freeddns.org;

    # Let's Encrypt challenge (certbot writes here for issuance + renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the application.
server {
    # `listen ... http2` (not the newer `http2 on;`) so `nginx -t` passes on
    # nginx < 1.25.1 too — newer builds just emit a harmless deprecation warning.
    listen 443 ssl http2;
    server_name showcase.freeddns.org;

    ssl_certificate     /etc/letsencrypt/live/showcase.freeddns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showcase.freeddns.org/privkey.pem;

    # Self-contained TLS settings — no external certbot includes, so this file is
    # the whole source of truth and `nginx -t` never depends on plugin-managed files.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling. resolver is systemd-resolved's stub (Ubuntu default).
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            127.0.0.53 valid=300s;
    resolver_timeout    5s;

    # Security headers. HTTPS-only + preload-eligible HSTS (required for .app).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # BFF model: the browser only talks same-origin (/api, /auth); the backend
    # talks to Keycloak server-to-server. connect-src lists the Keycloak origin
    # for safety. No direct third-party sockets (unlike Blondi's xAI realtime).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://auth-colmena.freeddns.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none';" always;
    server_tokens off;

    # Proxy: backend API
    location /api/ {
        limit_req zone=showcase_per_ip burst=60 nodelay;

        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # OIDC callback sets large auth cookies.
        proxy_buffer_size       32k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 96k;
    }

    # Proxy: auth endpoints (OIDC callbacks)
    location /auth/ {
        limit_req zone=showcase_per_ip burst=20 nodelay;

        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # OIDC callback sets large auth cookies.
        proxy_buffer_size       32k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 96k;
    }

    # SPA: serve the built React app + fallback to index.html.
    location / {
        root  /var/www/showcase;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML is never cached; Vite-hashed assets are immutable.
        location ~* \.html$ {
            add_header Cache-Control "no-store, must-revalidate";
        }
        location ~* \.(js|css|woff2?|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
