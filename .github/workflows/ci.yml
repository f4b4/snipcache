name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Site and frontend
    runs-on: ubuntu-latest
    # The site is built from site/sample-content under a non-root base with an
    # editor URL, the way content repos deploy it; check-build verifies that.
    env:
      SNIPCACHE_SITE: https://example.github.io
      SNIPCACHE_BASE: /snipcache-sample
      SNIPCACHE_EDITOR_URL: https://snipcache.example.org
    steps:
      - uses: actions/checkout@v5
      # No "packageManager" pin in package.json; keep the major in step with
      # the locally installed pnpm (lockfile format).
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The editor's hooks are generated from the committed OpenAPI spec and
      # committed too; regenerating must not change anything.
      - name: Generated API client is up to date
        run: |
          pnpm --filter editor generate:api
          git add --intent-to-add frontend/apps/editor/src/api/generated
          git diff --exit-code -- frontend/apps/editor/src/api/generated
      - run: pnpm build
      - name: Site build smoke test
        run: pnpm --filter site check-build
      - run: pnpm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # The steps switch on by themselves once the first project exists.
      - name: Build
        if: hashFiles('backend/**/*.csproj') != ''
        run: dotnet build SnipCache.slnx --configuration Release
      # The build rewrites openapi.json, which the editor's client is generated
      # from; it must be committed with every API change.
      - name: OpenAPI spec is up to date
        if: hashFiles('backend/**/*.csproj') != ''
        run: git diff --exit-code -- backend/apps/SnipCacheEditor/openapi/openapi.json
      - name: Test
        if: hashFiles('backend/**/*.csproj') != ''
        run: dotnet test --solution SnipCache.slnx --configuration Release --no-build
